name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package supports both, and consumers are split across them:
        # logres-site and burdgen are on 13, mary.win is on 12. A constraint
        # that is only ever exercised on one of them rots quietly.
        laravel: ['12', '13']
    name: Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Pin the Laravel major under test
        run: >-
          composer update --with-all-dependencies --no-interaction --no-progress
          "illuminate/contracts:^${{ matrix.laravel }}.0"
          "illuminate/http:^${{ matrix.laravel }}.0"
          "illuminate/session:^${{ matrix.laravel }}.0"
          "illuminate/support:^${{ matrix.laravel }}.0"
      - run: composer check
      - run: composer audit --locked --no-interaction
      - name: Scan Git history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.28.0 git --redact --no-banner
